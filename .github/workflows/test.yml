name: test-connections
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test WordPress and OpenRouter
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install requests
          python - <<'EOF'
          import os, requests
          wp = os.environ["WP_URL"]
          auth = (os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"])
          r = requests.get(f"{wp}/wp-json/wp/v2/users/me", auth=auth, timeout=30)
          print("WordPress:", r.status_code, r.text[:200])
          r = requests.get("https://openrouter.ai/api/v1/auth/key",
              headers={"Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"]}, timeout=30)
          print("OpenRouter:", r.status_code, r.text[:200])
          EOF
