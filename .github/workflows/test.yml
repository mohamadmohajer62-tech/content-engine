name: test-connections
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Test WordPress
        run: |
          curl -s -o /dev/null -w "WordPress status: %{http_code}\n" -u "$WP_USER:$WP_APP_PASSWORD" "https://mohammadmohajer.ir/wp-json/wp/v2/users/me"
      - name: Test OpenRouter
        run: |
          curl -s -o /dev/null -w "OpenRouter status: %{http_code}\n" -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/auth/key
