name: test-image
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Image model ID"
        required: true
      prompt:
        description: "Image prompt (optional)"
        required: false

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test image
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          MODEL: ${{ github.event.inputs.model }}
          PROMPT: ${{ github.event.inputs.prompt }}
        run: python test_image.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-image
          path: test_out.*
          if-no-files-found: ignore
