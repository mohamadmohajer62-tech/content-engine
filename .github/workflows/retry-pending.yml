name: retry-pending
on:
  workflow_dispatch:
  schedule:
    - cron: "10 */3 * * *"

permissions:
  contents: write

concurrency:
  group: retry-pending
  cancel-in-progress: false

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Retry pending drafts
        env:
          WP_USER: content-bot
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python retry_pending.py
      - name: Save state
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A pending
          git diff --cached --quiet || (git commit -m "update pending" && git push)
