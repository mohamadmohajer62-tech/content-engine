name: announce
on:
  workflow_dispatch:
    inputs:
      force_ids:
        description: "Post IDs to re-send (comma separated, optional)"
        required: false
      test_follow_id:
        description: "آزمایش سه پیام پیاپی: شماره‌ی مقاله (فقط به چت شخصی شما می‌فرستد، نه کانال‌ها)"
        required: false
        default: ""
  schedule:
    # هر ۱۵ دقیقه (برای فاصله‌ی دقیق‌تر پیام‌های پیاپی)
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Lower MTU (fixes timeouts to the WordPress host)
        run: |
          IFACE=$(ip route show default | awk '{print $5}' | head -1)
          sudo ip link set dev "$IFACE" mtu 1200
      - name: Announce new posts and follow-ups
        env:
          WP_USER: content-bot
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: gpt-4o-mini
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          FORCE_IDS: ${{ github.event.inputs.force_ids }}
          TEST_FOLLOW_ID: ${{ github.event.inputs.test_follow_id }}
        run: python announce.py
      - name: Save state
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add announced.json
          git diff --cached --quiet || (git commit -m "update announced" && git push)
