name: announce
on:
  workflow_dispatch:
    inputs:
      force_ids:
        description: "Post IDs to re-send (comma separated, optional)"
        required: false
  schedule:
    # هر ساعت، دقیقه‌ی ۱۵
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Announce new posts
        env:
          WP_USER: content-bot
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          FORCE_IDS: ${{ github.event.inputs.force_ids }}
        run: python announce.py
      - name: Save state
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add announced.json
          git diff --cached --quiet || (git commit -m "update announced" && git push)
