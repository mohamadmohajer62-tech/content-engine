name: image-lab
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "models = فهرست مدل‌ها | cover = تصویر شاخص | infographic = اینفوگرافیک"
        type: choice
        default: models
        options: [models, cover, infographic]
      post_id:
        description: "شماره‌ی مقاله در وردپرس (اختیاری)"
        required: false
        default: ""
      title:
        description: "عنوان مقاله (اگر post_id ندارید)"
        required: false
        default: ""
      keyword:
        description: "کلمه‌ی کلیدی یا مضمون تصویر (اختیاری)"
        required: false
        default: ""
      models:
        description: "شناسه‌ی مدل‌ها با کاما (برای مقایسه)؛ مثال: gpt-image-2,flux-schnell"
        required: false
        default: "gpt-image-2"
      tiles:
        description: "تعداد کادر اینفوگرافیک"
        type: choice
        default: "6"
        options: ["4", "6", "8"]
      fmt:
        description: "قالب اینفوگرافیک"
        type: choice
        default: post
        options: [post, story]

jobs:
  i:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow playwright
      - name: Install fonts and browser
        if: ${{ github.event.inputs.mode == 'infographic' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core || true
          sudo apt-get install -y fonts-vazirmatn || echo "Vazirmatn not available; using Noto"
          python -m playwright install --with-deps chromium
      - name: Lower MTU (fixes timeouts to the WordPress host)
        run: |
          IFACE=$(ip route show default | awk '{print $5}' | head -1)
          sudo ip link set dev "$IFACE" mtu 1200
      - name: Run image lab
        env:
          WP_USER: content-bot
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: gpt-4o-mini
          IMAGE_SIZE: "1536x1024"
          IMAGE_QUALITY: "low"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
          POST_ID: ${{ github.event.inputs.post_id }}
          TITLE: ${{ github.event.inputs.title }}
          KEYWORD: ${{ github.event.inputs.keyword }}
          MODELS: ${{ github.event.inputs.models }}
          TILES: ${{ github.event.inputs.tiles }}
          FMT: ${{ github.event.inputs.fmt }}
        run: python image_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-lab
          path: out/
          if-no-files-found: ignore
          retention-days: 3
