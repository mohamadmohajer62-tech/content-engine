name: cover-fix
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID (number)"
        required: true

jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow playwright
      - name: Install fonts and browser
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core
          python -m playwright install --with-deps chromium
      - name: Lower MTU (fixes timeouts to the WordPress host)
        run: |
          IFACE=$(ip route show default | awk '{print $5}' | head -1)
          sudo ip link set dev "$IFACE" mtu 1200
          ip link show "$IFACE" | head -1
      - name: Make cover
        env:
          WP_USER: content-bot
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          LLM_MODEL: gpt-4o-mini
          IMAGE_MODEL: "gpt-image-2"
          IMAGE_SIZE: "1536x1024"
          POST_ID: ${{ github.event.inputs.post_id }}
        run: python cover_fix.py
