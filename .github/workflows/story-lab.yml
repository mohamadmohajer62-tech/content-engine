name: story-lab
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "شماره‌ی مقاله در وردپرس (ترجیحاً پیش‌نویس یا منتشرشده؛ از نشانی ویرایش مقاله بخوانید)"
        required: false
        default: ""
      title:
        description: "عنوان مقاله (اگر post_id ندارید؛ اگر post_id دارید خالی بگذارید)"
        required: false
        default: ""
      hook:
        description: "جمله‌ی معرفی استوری ۱ (اختیاری؛ خالی = خودکار)"
        required: false
        default: ""
      quote1:
        description: "نقل‌قول اول (اختیاری؛ خالی = خودکار از متن مقاله)"
        required: false
        default: ""
      quote2:
        description: "نقل‌قول دوم (اختیاری؛ خالی = خودکار)"
        required: false
        default: ""
      which:
        description: "کدام استوری‌ها"
        type: choice
        default: all
        options: [all, intro, quotes]

jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow playwright
      - name: Install fonts and browser
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core || true
          sudo apt-get install -y fonts-vazirmatn || echo "Vazirmatn not available; using Noto"
          python -m playwright install --with-deps chromium
      - name: Lower MTU (fixes timeouts to the WordPress host)
        run: |
          IFACE=$(ip route show default | awk '{print $5}' | head -1)
          sudo ip link set dev "$IFACE" mtu 1200
      - name: Make stories
        env:
          WP_USER: content-bot
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: gpt-4o-mini
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          POST_ID: ${{ github.event.inputs.post_id }}
          TITLE: ${{ github.event.inputs.title }}
          HOOK: ${{ github.event.inputs.hook }}
          QUOTE1: ${{ github.event.inputs.quote1 }}
          QUOTE2: ${{ github.event.inputs.quote2 }}
          WHICH: ${{ github.event.inputs.which }}
        run: python story_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stories
          path: out/
          if-no-files-found: ignore
          retention-days: 3
