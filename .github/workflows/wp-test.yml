name: WP connectivity test
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner IP
        run: curl -s https://api.ipify.org; echo

      - name: Test WordPress
        env:
          WP_USER: ${{ secrets.content-bot }}
          WP_PASS: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          pip install requests -q
          python - <<'EOF'
          import os, time, requests
          WP = "https://mohammadmohajer.ir"
          AUTH = (os.environ["WP_USER"], os.environ["WP_PASS"])

          def show(name, r):
              print(f"\n=== {name} ===")
              print("status:", r.status_code)
              for h in ("server", "via", "cf-ray", "x-powered-by", "retry-after", "content-type"):
                  if h in r.headers:
                      print(f"{h}: {r.headers[h]}")
              print("body:", r.text[:300].replace("\n", " "))

          def run(name, method, url, **kw):
              t = time.time()
              try:
                  r = requests.request(method, url, timeout=60, **kw)
                  show(name, r)
                  print(f"time: {time.time()-t:.1f}s")
                  return r
              except Exception as e:
                  print(f"\n=== {name} ===\nFAILED after {time.time()-t:.1f}s: {type(e).__name__}: {str(e)[:200]}")

          run("GET home", "GET", WP)
          run("GET posts", "GET", WP + "/wp-json/wp/v2/posts?per_page=1")
          run("GET me (auth)", "GET", WP + "/wp-json/wp/v2/users/me", auth=AUTH)

          r = run("POST tiny draft", "POST", WP + "/wp-json/wp/v2/posts", auth=AUTH,
                  json={"title": "test-delete-me", "content": "test", "status": "draft"})
          if r is not None and r.status_code in (200, 201):
              pid = r.json().get("id")
              run("DELETE draft", "DELETE", f"{WP}/wp-json/wp/v2/posts/{pid}?force=true", auth=AUTH)

          png = bytes.fromhex("89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000d49444154789c6360000002000001e221bc330000000049454e44ae426082")
          r = run("POST tiny media", "POST", WP + "/wp-json/wp/v2/media", auth=AUTH,
                  headers={"Content-Disposition": 'attachment; filename="t.png"', "Content-Type": "image/png"},
                  data=png)
          if r is not None and r.status_code in (200, 201):
              mid = r.json().get("id")
              run("DELETE media", "DELETE", f"{WP}/wp-json/wp/v2/media/{mid}?force=true", auth=AUTH)
          EOF
